# Combat tuning overrides for Abyss.
# Leave a key commented out to use the compiled-in default.
# Resolution order (first match wins):
#   1. JVM system property  -Dabyss.combat.<key>=...
#   2. Environment variable  ABYSS_COMBAT_<KEY>  (dots become underscores)
#   3. This file
#   4. Compiled default
#
# Alternate file: -Dabyss.combat.config.path=path/to/file  or  ABYSS_COMBAT_CONFIG_PATH
#
# dodge.distancePx=210
# dodge.durationMs=180
# dodge.iframeMs=220
# dodge.cooldownMs=900
# hurt.iframeMs=350
# hitstop.critMs=55
# hitstop.heavyMs=45
# slam.windupMs=700
# shotgun.falloffStartPx=170
# shotgun.falloffEndPx=520
